version: 2

# Cheapest first. Unregistered skills and plain chat go to the first;
# subagents run one step below their parent, never below the first.
order: [light, moderate, complex]

# Each tier's model lives in litellm/config.yaml under the same name, so a
# new model release is a one-line change there.
tiers:
  light:
    vendor: anthropic
    effort: low
    max_input: 64000
    max_output: 4000
  moderate:
    vendor: anthropic
    effort: medium
    max_input: 128000
    max_output: 4000
  complex:
    vendor: anthropic
    effort: high
    max_input: 180000
    max_output: 8000

# Only these skills, with a matching hash, reach a tier above the lowest.
# Anything else -- plain chat, unregistered skills -- goes to the lowest tier.
skills:
  design-review:
    tier: complex
    sha256: "28643128a44b56d7ac59e7d075d9b27fa1f0dff3275bb44d9824b0585742609e"
    bytes: 627
  incident-postmortem:
    tier: complex
    sha256: "7d99d4ff0879e71635e77ba5e2c003376f83355d75c0d557328062b814fc0da3"
    bytes: 668
  code-review:
    tier: moderate
    sha256: "b80501d2b2d34e05567bfcc59ef062c77e82173d05ad976a9fd279badab20aaa"
    bytes: 521
  unit-tests:
    tier: moderate
    sha256: "bc6e789851cd74981ce8c4f167ca62cb6956f3ad0032028a226acdf8d1f055c8"
    bytes: 526
  commit-message:
    tier: light
    sha256: "a7929e0d2123b6887fb2f3da522783396df2f731f9758e333db753e6337c5a10"
    bytes: 424
  changelog-summary:
